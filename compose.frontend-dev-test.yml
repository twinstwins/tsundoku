name: tsundoku-frontend-dev-test
services:
  web:
    environment:
      RAILS_ENV: development
      REACT_USERS_ENABLED: "1"
      REACT_CONTENT_DETAIL_ENABLED: "1"
      REACT_PROFILE_ENABLED: "1"
      REACT_LIKES_ENABLED: "1"
      REACT_COMMENTS_ENABLED: "1"
      REACT_FOLLOWS_ENABLED: "1"
      VITE_DEV_SERVER_URL: http://frontend:5173
    depends_on:
      frontend:
        condition: service_healthy
  frontend:
    image: node:24.22.1-bookworm-slim
    working_dir: /workdir/frontend
    command: sh -c 'npm ci --no-fund && npm run dev'
    environment:
      VITE_DEV_SERVER_URL: http://frontend:5173
      RAILS_ORIGIN: http://web:3000
      VITE_USE_POLLING: "1"
    volumes:
      - ./tmp/frontend-dev-test:/workdir/frontend
      - ./types:/workdir/types:ro
      - frontend_dev_node_modules:/workdir/frontend/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  e2e:
    command: sh -c 'npm ci && npm run test:e2e:dev'
    environment:
      EXPECT_REACT_USERS: "1"
      EXPECT_REACT_CONTENT_DETAIL: "1"
      EXPECT_REACT_PROFILE: "1"
      EXPECT_REACT_LIKES: "1"
      EXPECT_REACT_COMMENTS: "1"
      EXPECT_REACT_FOLLOWS: "1"
      FRONTEND_TEST_SOURCE: /frontend-source
    volumes:
      - ./tmp/frontend-dev-test:/frontend-source
volumes:
  frontend_dev_node_modules:
