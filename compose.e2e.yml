name: tsundoku-e2e

services:
  db:
    image: mysql:5.6
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build: .
    platform: linux/amd64
    environment:
      RAILS_ENV: ${E2E_RAILS_ENV:-development}
      REACT_USERS_ENABLED: ${REACT_USERS_ENABLED:-0}
      SECRET_KEY_BASE: isolated-e2e-secret-not-used-outside-tests-0123456789abcdef0123456789abcdef
      RAILS_SERVE_STATIC_FILES: "1"
      DATABASE_URL: mysql2://root:password@db/Tsundoku_e2e
      DISABLE_SPRING: "1"
    command: >-
      sh -c 'bundle exec rails db:create db:migrate &&
      if [ "$$RAILS_ENV" = "production" ]; then bundle exec rails assets:precompile; fi &&
      rm -f tmp/pids/server.pid &&
      bundle exec rails server -b 0.0.0.0 -p 3000'
    ports:
      - "127.0.0.1:${E2E_PORT:-43122}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 3s
      timeout: 15s
      retries: 30
      start_period: 15s

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    init: true
    ipc: host
    working_dir: /tests
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      CI: ${CI:-}
      EXPECT_REACT_USERS: ${REACT_USERS_ENABLED:-0}
      E2E_ALL_BROWSERS: ${E2E_ALL_BROWSERS:-0}
    volumes:
      - .:/tests
      - e2e_node_modules:/tests/node_modules
      - api_types_node_modules:/tests/tools/api-types/node_modules
      - frontend_node_modules:/tests/frontend/node_modules
    command: >-
      sh -c 'npm ci && npm --prefix tools/api-types ci && npm --prefix frontend ci &&
      npm run api:types:check && npm run typecheck && npm --prefix frontend run typecheck &&
      npm --prefix frontend test && npm run test:e2e && npm run test:e2e:react'
    depends_on:
      web:
        condition: service_healthy

volumes:
  e2e_node_modules:
  api_types_node_modules:
  frontend_node_modules:
